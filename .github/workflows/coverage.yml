name: Build and Test Coverage

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Run Backend Tests with JaCoCo
      run: |
        cd backend
        mvn test
    - name: Upload Backend Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage-report
        path: backend/target/site/jacoco/

  frontend-coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install Dependencies
      run: |
        cd frontend
        npm ci
    - name: Run Frontend Tests with Karma
      run: |
        cd frontend
        npm run test:coverage
    - name: Upload Frontend Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: frontend-coverage-report
        path: frontend/coverage/

  deploy-to-ec2:
    needs: [backend-coverage, frontend-coverage]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_IP }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Fix permissions and safe directory
          git config --global --add safe.directory /home/ubuntu/Taller1-AppAgenda
          sudo chown -R ubuntu:ubuntu /home/ubuntu/Taller1-AppAgenda
          # Go to app directory
          cd /home/ubuntu/Taller1-AppAgenda
          # Pull latest changes
          git pull origin main
          # Rebuild and restart containers
          sudo docker compose up -d --build
